<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }
        
        body { 
            background: #000;
            font-family: monospace;
            color: #ff0000;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h2 { 
            text-align: center; 
            margin-top: 30px;
            border-bottom: 2px solid #ff0000;
            padding-bottom: 10px;
        }
        
        form {
            background: #000;
            border: 2px solid #ff0000;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            margin-bottom: 30px;
        }
        
        fieldset {
            border: 2px solid #ff0000;
            padding: 20px;
        }
        
        legend {
            color: #ff0000;
            font-size: 1.1em;
            font-weight: bold;
            padding: 0 10px;
        }
        
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ff0000;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #000;
            color: #ff0000;
            border: 1px solid #ff0000;
        }
        
        input[type="radio"] { 
            accent-color: #ff0000;
            margin-right: 5px;
        }
        
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #ff0000;
            color: #000;
            border: 2px solid #ff0000;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        input[type="submit"]:hover {
            background: #000;
            color: #ff0000;
        }
        
        #movieList { 
            max-width: 450px;
            width: 100%;
        }
        
        #movieList div { 
            padding: 12px;
            margin-bottom: 8px;
            background: #000;
            border: 1px solid #ff0000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ff0000;
        }
        
        button { 
            padding: 6px 12px;
            background: #ff0000;
            color: #000;
            border: 1px solid #ff0000;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        button:hover { 
            background: #000;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <form id="movies">
        <fieldset form="movies">
            <legend>Add a Movie</legend>
                <label for="Title">Title</label><br>
                <input type="text" id="Title" required><br><br>

                <label for="Year">Year</label><br>
                <input type="number" id="Year" required><br><br>

                <label for="Genre">Genre</label><br>
                <select id="Genre" required>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Horror">Horror</option>
                    <option value="Romance">Romance</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Drama">Drama</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Documentary">Documentary</option>
                    <option value="Anime">Anime</option>
                    <option value="Comedy">Comedy</option>
                </select><br><br>

                Rating<br>
                    <input type="radio" id="1star" name="rating" value="1star">
                    <input type="radio" id="2star" name="rating" value="2star">
                    <input type="radio" id="3star" name="rating" value="3star">
                    <input type="radio" id="4star" name="rating" value="4star">
                    <input type="radio" id="5star" name="rating" value="5star"><br><br>
                
                <input type="submit" value="Add Movie">
        </fieldset>
    </form>

    <h2>Movie List</h2>
    <div id="movieList"></div>

    <script>
        const form = document.getElementById('movies');
        const movieList = document.getElementById('movieList');

        // Convert numeric rating to star symbols
        function getStars(rating) {
            return '★'.repeat(rating);
        }

        // Extract numeric value from radio button string
        function getRatingValue(ratingString) {
            return parseInt(ratingString.replace('star', ''));
        }

        // Load and display all movies from localStorage
        function loadMovies() {
            const movies = JSON.parse(localStorage.getItem('movies')) || [];
            movieList.innerHTML = '';
            movies.forEach((movie, index) => {
                const div = document.createElement('div');
                div.style.marginBottom = '10px';
                div.innerHTML = `${movie.title} (${movie.year}) - ${movie.genre}, Rating: ${getStars(movie.rating)} 
                <button type="button" data-index="${index}" style="margin-left: 10px;">Delete</button>`;
                
                const deleteBtn = div.querySelector('button');
                deleteBtn.addEventListener('click', function() {
                    if (confirm('Are you sure you want to delete this movie?')) {
                        movies.splice(index, 1);
                        localStorage.setItem('movies', JSON.stringify(movies));
                        loadMovies();
                    }
                });
                
                movieList.appendChild(div);
            });
        }

        // Handle form submission - add new movie or update existing
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const ratingValue = getRatingValue(document.querySelector('input[name="rating"]:checked').value);
            
            const newMovie = {
                title: document.getElementById('Title').value,
                year: document.getElementById('Year').value,
                genre: document.getElementById('Genre').value,
                rating: ratingValue
            };
            
            const movies = JSON.parse(localStorage.getItem('movies')) || [];
            const existingIndex = movies.findIndex(m => m.title.toLowerCase() === newMovie.title.toLowerCase());
            
            // Update existing movie with averaged rating
            if (existingIndex !== -1) {
                const oldRating = movies[existingIndex].rating;
                const newRating = newMovie.rating;
                const averagedRating = Math.round((oldRating + newRating) / 2);
                
                movies[existingIndex] = {
                    title: newMovie.title,
                    year: newMovie.year,
                    genre: newMovie.genre,
                    rating: averagedRating
                };
            } else {
                movies.push(newMovie);
            }
            
            localStorage.setItem('movies', JSON.stringify(movies));
            form.reset();
            loadMovies();
        });

        loadMovies();
    </script>
</body>
</html>
